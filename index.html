<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofia Calderon — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .index-wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px 32px;
  }
  .index-head{max-width:640px; margin:0 auto 48px; text-align:center;}
  .index-head .eyebrow{justify-content:center; display:flex;}
  .index-head h1{font-size:clamp(30px,4.4vw,46px); margin-top:14px; line-height:1.12;}
  .index-cards{
    max-width:900px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:24px;
  }
  @media(max-width:700px){ .index-cards{grid-template-columns:1fr;} }
  .index-card{
    display:block;
    border:1px solid var(--ink);
    background:var(--white);
    padding:32px 28px;
    opacity:1;
    filter:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .index-card:hover{transform:translateY(-3px); box-shadow:4px 4px 0 var(--ink);}
  .index-card .sheet-no{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.08em;}
  .index-card h2{font-size:24px; margin:10px 0 10px;}
  .index-card p{color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
  .index-card .enter{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .index-card.eng .enter{color:#2E4756;}
  .index-card.viz .enter{color:#C4671F;}
  .index-card .enter::after{content:"→"; transition:transform .15s ease;}
  .index-card:hover .enter::after{transform:translateX(4px);}
  .index-footer{
    max-width:900px; margin:44px auto 0; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.05em;
  }
</style>
</head>
<body>

<div class="index-wrap">
  <div class="index-head">
    <span class="eyebrow">Portfolio</span>
    <h1>Sofia Calderon</h1>
  </div>

  <div class="index-cards">
    <a class="index-card eng" href="portfolio-engineering.html">
      <span class="sheet-no">SHEET 01</span>
      <h2>Engineering</h2>
      <p>CAD, systems design, and technical asset preparation for lab equipment and VR training workflows.</p>
      <span class="enter">Enter</span>
    </a>
    <a class="index-card viz" href="portfolio-visualization.html">
      <span class="sheet-no">SHEET 02</span>
      <h2>Visualization</h2>
      <p>Model preparation, materials, lighting, and scene setup for real-time visualization and simulation.</p>
      <span class="enter">Enter</span>
    </a>
  </div>

</div>

</body>
</html>
